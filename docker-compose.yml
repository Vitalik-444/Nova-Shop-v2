services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myproject
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/docker/init:/docker-entrypoint-initdb.d:ro   # роль app_user (виконується при створенні тома)
      - ./db/data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myproject"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
volumes:
  pgdata:
