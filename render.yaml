services:
  - type: web
    name: nova-shop
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node scripts/migrate.js && node scripts/seed.js --auto && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-shop-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ASSISTANT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM_NAME
        value: NovaShop
      - key: SMTP_USER
        value: nova444shop@gmail.com
      - key: SMTP_FROM_EMAIL
        value: nova444shop@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: nova-shop-db
    plan: free
    databaseName: novashop
    user: novashop_user
