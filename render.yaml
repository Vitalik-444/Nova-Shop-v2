services:
  - type: web
    name: nova-shop
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node scripts/migrate.js && node scripts/seed.js --auto && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nova-shop-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: nova-shop-db
    plan: free
    databaseName: novashop
    user: novashop_user
